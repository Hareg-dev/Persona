[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procurebrain"
version = "0.1.0"
description = "Chat-first procurement intelligence backend with LangGraph, MongoDB, and Qdrant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "langchain-groq>=0.2.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.20",
  "motor>=3.6.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "pypdf>=5.0.0",
  "pymongo>=4.8.0",
  "qdrant-client>=1.11.1",
  "trafilatura>=1.12.2",
  "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
